name: news_reader
description: " A Flutter news application using public API"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.8.1

dependencies:
  flutter:
    sdk: flutter
  http: ^1.1.0
  provider: ^6.1.1
  cached_network_image: ^3.3.0
  shared_preferences: ^2.2.2
  url_launcher: ^6.1.11
  intl: ^0.20.2
  pull_to_refresh: ^2.0.0
  cupertino_icons: ^1.0.8
  json_annotation: ^4.9.0
  share_plus: ^6.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  build_runner: ^2.4.0
  json_serializable: ^6.7.1
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
